<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint 0 Test</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#111;color:#eee}
h1{font-size:18px}
#out{white-space:pre-wrap;font-family:monospace;font-size:13px;background:#1c1c1c;padding:12px;border-radius:8px;line-height:1.5}
.ok{color:#4ade80}.bad{color:#f87171}
button{margin-top:16px;padding:12px 18px;font-size:15px;background:#2563eb;color:#fff;border:0;border-radius:8px}
</style>
</head>
<body>
<h1>Platform Test — modules + IndexedDB</h1>
<div id="out">Loading module…</div>
<button id="reset">Wipe test data</button>
<script type="module" src="js/test.js"></script>
<script>
// Fallback: if the module never runs, Check A failed.
setTimeout(function(){
  var o=document.getElementById('out');
  if(o.textContent.indexOf('Loading module')===0){
    o.innerHTML='<span class="bad">CHECK A FAILED — module did not execute.</span>\n'+
    'Open Chrome menu > Desktop site, or check the console for a MIME/CORS error.';
  }
},2500);
</script>
</body>
</html>
