<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="description" content="A trading education and discipline system for Indian markets. Learning is free. Trading is earned.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trading System">
<title>Trading Career System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="topbar">
  <div class="tb-row">
    <div class="tb-text">
      <div class="tb-title" id="tbTitle">Today</div>
      <div class="tb-sub" id="tbSub"></div>
    </div>
    <button id="tbAction" class="icon" data-go="settings" aria-label="Settings">&#9881;</button>
  </div>
  <nav id="subnav" class="subnav" aria-label="Section screens"></nav>
</header>

<main id="app"><div class="skeleton"><div class="sk-card"></div><div class="sk-card"></div></div></main>

<nav id="tabbar" class="tabbar" aria-label="Main sections">
  <button data-section="today" class="sel"><span class="ti">&#9673;</span><span class="tl">Today</span></button>
  <button data-section="learn"><span class="ti">&#9672;</span><span class="tl">Learn</span></button>
  <button data-section="trade"><span class="ti">&#9670;</span><span class="tl">Trade</span></button>
  <button data-section="review"><span class="ti">&#9680;</span><span class="tl">Review</span></button>
  <button data-section="more"><span class="ti">&#9776;</span><span class="tl">More</span></button>
</nav>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw:', e)));
}
</script>
</body>
</html>
